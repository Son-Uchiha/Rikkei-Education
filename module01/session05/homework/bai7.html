<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng Giá - Cấu hình Flexbox Chuẩn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">
    <div
      class="flex flex-col md:flex-row items-center justify-center gap-6 max-w-5xl w-full bg-white p-12 rounded-xl shadow-md min-h-[550px]"
    >
      <div
        class="w-full max-w-sm border border-gray-100 rounded-xl p-8 flex flex-col justify-between h-[400px] bg-white shadow-sm transition-transform hover:scale-102"
      >
        <div class="text-center">
          <h3 class="text-xl font-bold text-gray-800 mb-4">Cơ bản</h3>
          <span class="text-3xl font-extrabold text-gray-700 block mb-8">Miễn phí</span>

          <ul class="text-gray-500 space-y-3 text-sm font-medium">
            <li>1 Dự án</li>
            <li>100MB Lưu trữ</li>
            <li>Hỗ trợ Email</li>
          </ul>
        </div>

        <button
          class="w-full bg-[#2d3748] hover:bg-gray-700 text-white font-medium py-3 px-4 rounded-lg transition-colors text-sm"
        >
          Bắt đầu ngay
        </button>
      </div>

      <div
        class="w-full max-w-sm bg-[#007bff] text-white rounded-xl p-8 flex flex-col justify-between h-[400px] shadow-xl shadow-blue-500/20 transition-transform hover:scale-102 self-start"
      >
        <div class="text-center">
          <h3 class="text-xl font-bold mb-4 mt-2">Chuyên nghiệp</h3>
          <div class="mb-8">
            <span class="text-3xl font-extrabold">99.000đ</span>
            <span class="text-lg font-medium">/th</span>
          </div>

          <ul class="space-y-3 text-sm font-medium opacity-90">
            <li>Dự án Không Giới Hạn</li>
            <li>10GB Lưu trữ</li>
            <li>Hỗ trợ 24/7</li>
            <li>Domain Tuỳ chỉnh</li>
          </ul>
        </div>

        <button
          class="w-full bg-white hover:bg-gray-100 text-[#007bff] font-semibold py-3 px-4 rounded-lg transition-colors text-sm shadow-md"
        >
          Nâng Cấp
        </button>
      </div>

      <div
        class="w-full max-w-sm border border-gray-100 rounded-xl p-8 flex flex-col justify-between h-[400px] bg-white shadow-sm transition-transform hover:scale-102"
      >
        <div class="text-center">
          <h3 class="text-xl font-bold text-gray-800 mb-4">Doanh nghiệp</h3>
          <span class="text-3xl font-extrabold text-gray-700 block mb-8">Liên hệ</span>

          <ul class="text-gray-500 space-y-3 text-sm font-medium">
            <li>Gói tuỳ chọn đầy đủ</li>
            <li>Dung lượng cao nhất</li>
            <li>Tư vấn riêng biệt</li>
          </ul>
        </div>

        <button
          class="w-full bg-[#2d3748] hover:bg-gray-700 text-white font-medium py-3 px-4 rounded-lg transition-colors text-sm"
        >
          Tìm hiểu thêm
        </button>
      </div>
    </div>
  </body>
</html>
