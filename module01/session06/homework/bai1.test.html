<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-6 font-sans">
    <nav class="bg-slate-50 border border-gray-200 rounded-lg px-6 py-4 shadow-sm container mx-auto">
      <div class="flex items-center justify-between">
        <!-- Brand Logo -->
        <a href="#" class="text-xl font-bold text-gray-900">BookStore</a>
        <!-- Desktop Menu Links -->
        <div class="hidden md:flex items-center gap-6">
          <a href="#" class="font-medium">Trang chủ</a>
          <a href="#" class="hover:text-gray-500 transition-colors">Danh mục</a>
          <a href="#" class="hover:text-gray-500 transition-colors">Liên hệ</a>
        </div>
        <!-- Mobile Hamburger Button -->
        <button
          id="menu-toggle"
          type="button"
          class="md:hidden p-2 rounded-lg border-2 border-gray-500 text-gray-700 hover:bg-gray-200 focus:outline-none"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>

      <div id="mobile-menu" class="hidden flex-col pt-3 gap-3">
        <a href="#" class="block font-medium">Trang chủ</a>
        <a href="#" class="block hover:text-gray-500 transition-colors">Danh mục</a>
        <a href="#" class="block hover:text-gray-500 transition-colors">Liên hệ</a>
      </div>
    </nav>
    <!-- JavaScript for Toggle Menu -->
    <script>
      const menuToggle = document.getElementById("menu-toggle");
      const mobileMenu = document.getElementById("mobile-menu");

      menuToggle.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
        mobileMenu.classList.toggle("flex");
      });
    </script>
  </body>
</html>
