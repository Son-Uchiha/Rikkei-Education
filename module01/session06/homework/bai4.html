<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Sách - Tailwind CSS Table</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-12 px-4 sm:px-6 lg:px-8 font-sans">

  <div class="max-w-4xl mx-auto space-y-8">
    <!-- Tiêu đề -->
    <h2 class="text-2xl md:text-3xl font-bold text-center text-gray-900">
      Danh Sách Sách
    </h2>

    <!-- Bảng dữ liệu hỗ trợ cuộn trên Mobile (Responsive Table Wrapper) -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
      <table class="w-full text-left text-sm text-gray-900 border-collapse">
        <!-- Tiêu đề bảng -->
        <thead>
          <tr class="border-b border-gray-200 bg-white font-bold">
            <th scope="col" class="py-3.5 px-6 font-bold w-20">ID</th>
            <th scope="col" class="py-3.5 px-6 font-bold">Tên Sách</th>
            <th scope="col" class="py-3.5 px-6 font-bold">Tác Giả</th>
          </tr>
        </thead>
        <!-- Dữ liệu bảng -->
        <tbody class="divide-y divide-gray-100">
          <!-- Hàng 1 (Nền xám nhạt) -->
          <tr class="bg-gray-100/80 hover:bg-gray-200/60 transition-colors">
            <td class="py-3.5 px-6 font-bold">1</td>
            <td class="py-3.5 px-6">Hành Trình Về Phương Đông</td>
            <td class="py-3.5 px-6">Baird T. Spalding</td>
          </tr>
          <!-- Hàng 2 (Nền trắng) -->
          <tr class="bg-white hover:bg-gray-50 transition-colors">
            <td class="py-3.5 px-6 font-bold">2</td>
            <td class="py-3.5 px-6">Đắc Nhân Tâm</td>
            <td class="py-3.5 px-6">Dale Carnegie</td>
          </tr>
          <!-- Hàng 3 (Nền xám nhạt) -->
          <tr class="bg-gray-100/80 hover:bg-gray-200/60 transition-colors">
            <td class="py-3.5 px-6 font-bold">3</td>
            <td class="py-3.5 px-6">Nhà Giả Kim</td>
            <td class="py-3.5 px-6">Paulo Coelho</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</body>
</html>
