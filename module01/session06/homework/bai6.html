<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiểm tra Banner Freeship</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen font-sans">
    <!-- Dải thông báo Freeship (Ẩn trên di động, chỉ hiển thị từ máy tính bảng trở lên) -->

      class="hidden sm:block bg-amber-400 text-gray-900 py-3 px-4 text-center font-bold text-sm sm:text-base shadow-sm"

      🎉 Freeship cho đơn hàng từ 500k toàn quốc! 🎉

    <!-- Nội dung trang -->
    <main class="max-w-4xl mx-auto py-16 px-4 text-center">
      <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">Kiểm tra Banner Freeship</h1>
      <p class="mt-4 text-gray-600 text-sm sm:text-base">
        (Hãy thử co kéo kích thước trình duyệt xuống nhỏ hơn 640px để thấy dải thông báo màu vàng tự động ẩn đi)
