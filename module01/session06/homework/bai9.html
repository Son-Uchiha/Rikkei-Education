<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Talk - Tương Lai Lập Trình AI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 font-sans">

  <!-- Card Container chính -->
  <div class="max-w-4xl w-full bg-slate-50/90 rounded-2xl shadow-xl overflow-hidden border-t-4 border-[#8b1528] flex flex-col md:flex-row">
    
    <!-- Cột bên trái: Hình ảnh sự kiện -->
    <div class="w-full md:w-5/12 h-64 md:h-auto min-h-[300px] relative overflow-hidden">
      <img 
        src="https://images.unsplash.com/photo-1475721027785-f74eccf877e2?auto=format&fit=crop&w=800&q=80" 
        alt="Tech Talk Audience" 
        class="w-full h-full object-cover block"
      />
    </div>

    <!-- Cột bên phải: Nội dung sự kiện -->
    <div class="w-full md:w-7/12 p-6 sm:p-8 lg:p-10 flex flex-col justify-center space-y-5">
      
      <!-- Tiêu đề sự kiện -->
      <h1 class="text-2xl sm:text-3xl font-bold text-[#8b1528] leading-tight">
        Tech Talk: Tương Lai Lập Trình AI
      </h1>

      <!-- Mô tả -->
      <p class="text-gray-600 text-sm sm:text-base leading-relaxed">
        Tham gia cùng Rikkei Academy để khám phá những xu hướng công nghệ AI mới nhất và cách ứng dụng vào phát triển phần mềm trong tương lai.
      </p>

      <!-- Thông tin thời gian & địa điểm -->
      <div class="space-y-2 text-sm sm:text-base text-gray-800">
        <p><span class="font-bold text-gray-900">Thời gian:</span> 09:00 - 12:00, 25/11/2026</p>
        <p><span class="font-bold text-gray-900">Địa điểm:</span> Cơ sở Rikkei Academy HN</p>
      </div>

      <!-- Nút thao tác -->
      <div class="flex flex-wrap items-center gap-4 pt-2">
        <button 
          type="button" 
          class="bg-[#8b1528] hover:bg-[#70101f] active:bg-[#5a0c18] text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow-sm focus:ring-4 focus:ring-red-200"
        >
          Đăng Ký Ngay
        </button>
        <button 
          type="button" 
          class="bg-white hover:bg-gray-100 text-gray-700 font-medium px-6 py-2.5 rounded-lg border border-gray-300 transition-colors focus:ring-4 focus:ring-gray-100"
        >
          Xem Chi Tiết
        </button>
      </div>

    </div>

  </div>

</body>
</html>
