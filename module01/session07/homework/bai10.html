<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechGadget Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-[#1E293B] antialiased">
    <div class="flex min-h-screen">
      <aside class="hidden md:flex flex-col w-64 bg-[#0F172A] text-white flex-shrink-0 select-none">
        <div class="p-6">
          <h1 class="text-xl font-bold tracking-tight text-white">TechGadget Admin</h1>
        </div>

        <nav class="flex-1 px-4 space-y-2">
          <a href="#" class="flex items-center px-4 py-3 bg-[#2563EB] text-white font-medium rounded-xl transition-all">
            <span>Tổng quan</span>
          </a>

          <a
            href="#"
            class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 font-medium rounded-xl transition-all"
          >
            <span>Đơn hàng</span>
          </a>

          <a
            href="#"
            class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 font-medium rounded-xl transition-all"
          >
            <span>Sản phẩm</span>
          </a>

          <a
            href="#"
            class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 font-medium rounded-xl transition-all"
          >
            <span>Khách hàng</span>
          </a>
        </nav>
      </aside>

      <main class="flex-1 flex flex-col min-w-0">
        <header class="bg-white border-b border-slate-100 p-4 md:px-8">
          <div class="max-w-md">
            <div
              class="relative rounded-xl border border-slate-200 shadow-sm bg-white overflow-hidden focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all"
            >
              <input
                type="text"
                placeholder="Tìm kiếm mã đơn hàng, sản phẩm..."
                class="w-full pl-4 pr-4 py-2.5 text-sm bg-transparent outline-none text-slate-700 placeholder-slate-400"
              />
            </div>
          </div>
        </header>

        <div class="flex-1 p-4 md:p-8 space-y-6">
          <div>
            <h2 class="text-2xl font-bold text-[#0F172A] tracking-tight">Tổng quan hệ thống</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 md:gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
              <p class="text-xs font-medium text-slate-400 tracking-wide uppercase mb-2">Tổng doanh thu</p>
              <p class="text-xl md:text-2xl font-bold text-[#0F172A]">125.000.000 đ</p>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
              <p class="text-xs font-medium text-slate-400 tracking-wide uppercase mb-2">Đơn hàng mới</p>
              <p class="text-xl md:text-2xl font-bold text-[#0F172A]">342</p>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
              <p class="text-xs font-medium text-slate-400 tracking-wide uppercase mb-2">Khách hàng truy cập</p>
              <p class="text-xl md:text-2xl font-bold text-[#0F172A]">1,204</p>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
              <p class="text-xs font-medium text-slate-400 tracking-wide uppercase mb-2">Tỉ lệ chuyển đổi</p>
              <p class="text-xl md:text-2xl font-bold text-[#0F172A]">4.5%</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
